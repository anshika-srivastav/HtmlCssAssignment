<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three Ways to Add CSS</title>
<link rel="stylesheet" href="style.css">
<style>
.internal { color: green; }
</style>
</head>
<body>
<h1>CSS Fundamentals</h1>
<p style="color: red;">1. Inline CSS: this text is red.</p>
<p class="internal">2. Internal CSS: this text is green.</p>
<p class="external">3. External CSS: this text is blue.</p>
</body>
</html>
