<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Selectors</title>
<link rel="stylesheet" href="selectors.css">
</head>
<body>
<h1>CSS Selectors</h1>
<p>A normal paragraph (element selector).</p>
<p class="note">A paragraph with class note (class selector).</p>
<p id="special">A paragraph with id special (id selector).</p>
<div class="box">
<p>A paragraph inside a div (descendant selector).</p>
<a href="#">A link inside the box (hover over it)</a>
</div>
<h2>Group selector heading</h2>
</body>
</html>
