<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grid Gallery</title>
<style>
body { font-family: Arial, sans-serif; }
.grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 15px;
padding: 20px;
}
.item {
background: #1e5bb8;
color: white;
padding: 30px;
text-align: center;
border-radius: 8px;
}
.wide { grid-column: span 2; background: #f2a900; color: black; }
</style>
</head>
<body>
<div class="grid">
<div class="item wide">Item 1 (spans 2 columns)</div>
<div class="item">Item 2</div>
<div class="item">Item 3</div>
<div class="item">Item 4</div>
<div class="item">Item 5</div>
<div class="item">Item 6</div>
</div>
</body>
</html>
