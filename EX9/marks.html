<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marks Table</title>
<style>
table { border-collapse: collapse; width: 60%; }
th, td { border: 1px solid black; padding: 8px; text-align: center; }
thead { background-color: #dddddd; }
tfoot { font-weight: bold; }
</style>
</head>
<body>
<table>
<caption>Semester Marks (sample data)</caption>
<thead>
<tr><th>Subject</th><th>Internal</th><th>External</th><th>Total</th></tr>
</thead>
<tbody>
<tr><td>HTML and CSS</td><td>28</td><td>62</td><td>90</td></tr>
<tr><td>Java</td><td>25</td><td>58</td><td>83</td></tr>
<tr><td>DBMS</td><td>27</td><td>60</td><td>87</td></tr>
</tbody>
<tfoot>
<tr><td colspan="3">Grand Total</td><td>260</td></tr>
</tfoot>
</table>
</body>
</html>
