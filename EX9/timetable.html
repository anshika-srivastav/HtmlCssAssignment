<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time Table</title>
<style>
table { border-collapse: collapse; }
th, td { border: 1px solid black; padding: 10px 16px; text-align: center; }
th { background-color: #dddddd; }
</style>
</head>
<body>
<table>
<tr><th>Day</th><th>9:00 - 10:00</th><th>10:00 - 11:00</th><th>11:00 - 12:00</th></tr>
<tr><td>Monday</td><td>HTML</td><td colspan="2">Java Lab</td></tr>
<tr><td>Tuesday</td><td rowspan="2">Maths</td><td>CSS</td><td>DBMS</td></tr>
<tr><td>Wednesday</td><td>Java</td><td>HTML</td></tr>
</table>
</body>
</html>
