<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Box Model</title>
<style>
body { font-family: Arial, sans-serif; }
.box {
width: 200px;
padding: 20px;
border: 5px solid navy;
margin: 20px;
}
.content-box { box-sizing: content-box; background: lightblue; }
.border-box { box-sizing: border-box; background: lightgreen; }
</style>
</head>
<body>
<div class="box content-box">content-box:<br>
total width = 200+ 40+ 10 = 250px</div>
<div class="box border-box">border-box:<br>
total width = 200px</div>
</body>
</html>
