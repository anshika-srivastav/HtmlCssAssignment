<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cards</title>
<style>
body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 10px; }
.card {
display: inline-block;
vertical-align: top;
width: 250px;
margin: 10px;
background: white;
border-radius: 10px;
box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
overflow: hidden;
}
.card img { width: 100%; display: block; }
.card .body { padding: 12px; }
.card h3 { margin: 0 0 8px 0; }
.card button { background: #1e5bb8; color: white; border: none; padding: 8px 14px; border-radius: 5px; }
</style>
</head>
<body>
<div class="card">
<img src="images/campus.png" alt="Campus">
<div class="body">
<h3>Campus</h3>
<p>A view of the university campus.</p>
<button>Read more</button>
</div>
</div>
<div class="card">
<img src="images/campus.png" alt="Library">
<div class="body">
<h3>Library</h3>
<p>A quiet place to study.</p>
<button>Read more</button>
</div>
</div>
<div class="card">
<img src="images/campus.png" alt="Lab">
<div class="body">
<h3>Computer Lab</h3>
<p>Practice HTML, CSS and Java.</p>
<button>Read more</button>
</div>
</div>
</body>
</html>
