<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Text Formatting</title>
</head>
<body>
<h1>Text Formatting Tags</h1>
<p>This is <b>bold</b>, <i>italic</i> and <u>underlined</u> text.</p>
<p>This is <strong>important</strong> and <em>emphasised</em> text.</p>
<p>Water is H<sub>2</sub>O and the area is in m<sup>2</sup>.</p>
<p>Price: <del>Rs. 500</del> <ins>Rs. 400</ins>, this is <mark>highlighted</mark>.</p>
<p>First line<br>Second line after a line break</p>
<blockquote>Practice makes a programmer perfect.</blockquote>
<pre>
Line 1
Line 2 keeps its spaces
</pre>
</body>
</html>
