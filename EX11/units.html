<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Units</title>
<style>
html { font-size: 16px; }
body { font-family: Arial, sans-serif; margin: 10px; }
div { margin-bottom: 8px; padding: 4px; }
.px { width: 300px; background: #ffcccc; }
.em { font-size: 2em; background: #ffe9b3; }
.rem { font-size: 1.5rem; background: #ccffcc; }
.pct { width: 50%; background: #cce5ff; }
.vw { width: 40vw; background: #e6ccff; }
.vh { height: 10vh; background: #ffd9ec; }
</style>
</head>
<body>
<div class="px">width: 300px</div>
<div class="em">font-size: 2em</div>
<div class="rem">font-size: 1.5rem</div>
<div class="pct">width: 50% of the parent</div>
<div class="vw">width: 40vw</div>
<div class="vh">height: 10vh</div>
</body>
</html>
