<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign-Up Form</title>
</head>
<body>
<h1>Sign-Up Form</h1>
<form action="#" method="post">
<p><label for="name">Full Name:</label><br>
<input type="text" id="name" name="name"
placeholder="Enter your name" required></p>
<p><label for="email">E-mail:</label><br>
<input type="email" id="email" name="email" required></p>
<p><label for="pass">Password (minimum 6 characters):</label><br>
<input type="password" id="pass" name="pass" minlength="6"
required></p>
<p><label for="dob">Date of Birth:</label><br>
<input type="date" id="dob" name="dob"></p>
<input type="submit" value="Sign Up">
<input type="reset" value="Clear">
</form>
</body>
</html>
