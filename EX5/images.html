<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Images</title>
</head>
<body>
<h1>Images in HTML</h1>
<img src="images/campus.png" alt="University campus" width="350">
<p>An image with a fixed width and alternative text.</p>
<a href="https://www.wikipedia.org" target="_blank">
<img src="images/profile.png" alt="Profile picture" width="100" height="100">
</a>
<p>The image above is also a link.</p>
<figure>
<img src="images/campus.png" alt="Campus view" width="250">
<figcaption>Fig 1: Campus view</figcaption>
</figure>
</body>
</html>
