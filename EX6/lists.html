<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HTML Lists</title>
</head>
<body>
<h2>Unordered List</h2>
<ul>
<li>HTML</li>
<li>CSS</li>
<li>JavaScript</li>
</ul>
<h2>Ordered List</h2>
<ol>
<li>Open VS Code</li>
<li>Write the code</li>
<li>Run it in the browser</li>
</ol>
<h2>Ordered List with type and start</h2>
<ol type="A" start="3">
<li>Third item</li>
<li>Fourth item</li>
</ol>
<h2>Reversed Ordered List</h2>
<ol reversed>
<li>Gold</li>
<li>Silver</li>
<li>Bronze</li>
</ol>
</body>
</html>
