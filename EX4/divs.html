<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Divs and Attributes</title>
</head>
<body>
<div id="header" class="box"
style="border: 2px solid black; padding: 10px; margin: 10px;">
<h1>My Page</h1>
</div>
<div id="content" class="box"
style="border: 2px solid blue; padding: 10px; margin: 10px;
background-color: lightyellow;">
<p>This word is inside a <span style="color: red;">span</span>.</p>
<p id="note" title="This is a tooltip">Hover here to see the
title attribute.</p>
</div>
<div id="footer" class="box"
style="border: 2px solid green; padding: 10px; margin: 10px;">
<p>Footer text</p>
</div>
</body>
</html>
