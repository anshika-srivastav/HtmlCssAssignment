<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Grid</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; }
h2 { text-align: center; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 12px; }
.card { background: #e0f2f1; padding: 24px; text-align: center; border-radius: 8px; }
.note { text-align: center; color: #b00020; }
@media (max-width: 900px) {
.grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 500px) {
.grid { grid-template-columns: 1fr; }
.note { display: none; }
}
</style>
</head>
<body>
<h2>Responsive Grid</h2>
<p class="note">This note is hidden on small screens.</p>
<div class="grid">
<div class="card">Card 1</div>
<div class="card">Card 2</div>
<div class="card">Card 3</div>
<div class="card">Card 4</div>
</div>
</body>
</html>
