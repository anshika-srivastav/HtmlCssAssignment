<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flexbox Row</title>
<style>
body { font-family: Arial, sans-serif; }
.row {
display: flex;
flex-wrap: wrap;
gap: 16px;
padding: 20px;
}
.item {
flex: 1 1 200px;
background: #e8f0fe;
border: 1px solid #1e5bb8;
border-radius: 8px;
padding: 24px;
text-align: center;
}
</style>
</head>
<body>
<div class="row">
<div class="item">Item 1</div>
<div class="item">Item 2</div>
<div class="item">Item 3</div>
<div class="item">Item 4</div>
<div class="item">Item 5</div>
<div class="item">Item 6</div>
</div>
</body>
</html>
