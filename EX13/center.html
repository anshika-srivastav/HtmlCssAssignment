<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Centering with Flexbox</title>
<style>
body { font-family: Arial, sans-serif; }
.container {
display: flex;
height: 160px;
margin: 10px;
background: #dddddd;
}
.centered { justify-content: center; align-items: center; }
.column { flex-direction: column; justify-content: space-around; align-items: center; }
.inner { background: #1e5bb8; color: white; padding: 12px 24px; }
</style>
</head>
<body>
<div class="container centered">
<div class="inner">Centred box</div>
</div>
<div class="container column">
<div class="inner">One</div>
<div class="inner">Two</div>
</div>
</body>
</html>
